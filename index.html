<script>
const $=s=>document.querySelector(s);
const K={K1:'groupby chia dữ liệu thành nhóm',K2:'Chọn cột sau khi nhóm',K3:'Hàm tổng hợp: mean, sum'};
const Q=[
{k:'K1',t:'mc',q:'Trong <code>df.groupby("lop")</code>, giá trị <code>"lop"</code> dùng để làm gì?',o:['Chọn cột dùng để chia dữ liệu thành các nhóm','Lọc ra các dòng có giá trị là “lop”','Đổi tên cột thành “lop”','Sắp xếp bảng theo cột lop'],a:0,e:'groupby nhận tên cột và tạo một nhóm cho mỗi giá trị khác nhau trong cột đó.'},
{k:'K2',t:'tf',q:'Viết <code>["diem"]</code> sau groupby nghĩa là chỉ tính trên cột diem trong từng nhóm.',o:['Đúng','Sai'],a:0,e:'Dấu ngoặc vuông chọn cột, nên phép tính sau đó chỉ áp dụng cho cột đã chọn.'},
{k:'K3',t:'mc',q:'Lớp A có điểm 8 và 6, lớp B có điểm 9. <code>df.groupby("lop")["diem"].mean()</code> trả về gì?',o:['A: 7.0 và B: 9.0','A: 14 và B: 9','Một số duy nhất: 7.67','Báo lỗi'],a:0,e:'mean() tính trung bình riêng cho từng nhóm: (8 + 6) / 2 = 7.0 cho A và 9.0 cho B.'},
{k:'K3',t:'fill',q:'Để tính <b>tổng</b> điểm của từng lớp, thay <code>mean()</code> bằng hàm nào? Chỉ nhập tên hàm.',a:['sum'],e:'sum() cộng các giá trị trong mỗi nhóm.'},
{k:'K2',t:'mc',q:'Cách viết nào chọn cột <code>diem</code> sau khi nhóm theo <code>lop</code>?',o:['df.groupby("lop")["diem"]','df.groupby("diem")("lop")','df.groupby["lop"]["diem"]','df.select("diem")'],a:0,e:'Gọi groupby bằng ngoặc tròn, rồi chọn cột bằng ngoặc vuông.'}];

<div class="card"><h1>C1L2: DataFrame.groupby</h1><div class="row"><span class="c">45 phút</span><span class="c">Trung cấp</span><span class="c w" title="verified = false">Code chưa kiểm chứng</span></div>
<div class="tabs">${TABS()}</div>
<p>groupby giúp bạn tính thống kê theo từng nhóm, ví dụ điểm trung bình của mỗi lớp. Dòng dưới đây đi qua bốn bước:</p>
<div class="flow"><span>df</span><b>→</b><span>groupby("lop")</span><b>→</b><span>["diem"]</span><b>→</b><span>mean()</span><b>→</b><span>kết quả</span></div>
<pre>import pandas as pd

if(W.step===0)b='<h2>Bạn muốn học thư viện nào?</h2>'+fld('lib','Tên thư viện','Ví dụ: pandas, numpy, requests')+`<div class="fld"><label for="lang">Ngôn ngữ</label><select class="inp" id="lang" onchange="W.lang=this.value">${['Python','JavaScript','C++'].map(x=>`<option ${x===W.lang?'selected':''}>${x}</option>`).join('')}</select></div>`+fld('ver','Phiên bản','Bài học sẽ đúng với phiên bản này.')+fld('repo','Repository GitHub (không bắt buộc)','Bỏ trống nếu muốn hệ thống tự tìm.','https://github.com/...')+fld('docs','Link tài liệu chính thức (không bắt buộc)','Nhiều link thì cách nhau bằng dấu cách.','https://pandas.pydata.org/docs');
if(W.step===1)b=`<h2>Trình độ của bạn</h2><div class="g2">${[['beginner','Mới bắt đầu','Đã biết lập trình cơ bản, chưa dùng thư viện này.'],['intermediate','Trung cấp','Đã dùng thư viện tương tự, muốn học sâu hơn.']].map(([v,t,d])=>`<button class="lvl ${W.lv===v?'sel':''}" onclick="W.lv='${v}';render()"><b>${t}</b><br><span style="color:var(--mut)">${d}</span></button>`).join('')}</div>`;
if(W.step===2){const tot=(+W.days||0)*(+W.min||0);b='<h2>Bạn có bao nhiêu thời gian?</h2>'+fld('days','Số ngày')+fld('min','Số phút mỗi ngày')+fld('qz','Số câu quiz mỗi API')+`<span class="c ${tot<300?'w':''}">Tổng ${tot} phút, 20% dành cho mini-project${tot<300?'. Hơi ít, chỉ đủ các API thiết yếu':''}</span>`}
if(W.step===3)b=`<h2>Xác nhận thông tin</h2>${[['Thư viện',`${W.lib} ${W.ver} (${W.lang})`],['Trình độ',W.lv==='beginner'?'Mới bắt đầu':'Trung cấp'],['Thời gian',`${W.days} ngày, ${W.min} phút mỗi ngày`],['Quiz',`${W.qz} câu mỗi API`],['Repository',W.repo||'Tự tìm'],['Tài liệu',W.docs||'Mặc định']].map(([a,v])=>`<div class="m"><span>${a}</span><b>${v.replace(/</g,'&lt;')}</b></div>`).join('')}<div class="fld" style="margin-top:14px"><label><input type="checkbox" ${W.demo?'checked':''} onchange="W.demo=this.checked"> Chế độ demo (không dùng LLM, bài học chỉ là nội dung mẫu)</label></div>`;
return `<div class="card"><h1>Tạo lộ trình học</h1><p>Điền theo từng bước. Hệ thống kiểm tra dữ liệu trước khi sang bước tiếp theo.</p>${hd}${b}<div class="row" style="margin-top:12px">${W.step?'<button class="b" onclick="wb()">Quay lại</button>':''}${W.step<3?'<button class="b p" onclick="wn()">Tiếp tục</button>':'<button class="b p" onclick="gen()">Tạo lộ trình</button>'}</div></div>`}
const M0='import pandas as pd\n\n# 1. Đọc file diem.csv\n# 2. Tính điểm trung bình theo lớp\n# 3. Lọc học sinh dưới 5 điểm\n# 4. Xuất kết quả ra ketqua.csv\n# 5. Xử lý dòng thiếu dữ liệu\n';
const M={code:M0,res:null};
const TS=[['Đọc dữ liệu từ file CSV',/read_csv\(\s*["']diem\.csv["']/,'Dùng pd.read_csv("diem.csv").'],['Tính điểm trung bình theo lớp',/groupby\(\s*["']lop["']\s*\)\s*\[\s*["']diem["']\s*\]\s*\.mean\(/,'Dùng groupby("lop")["diem"].mean().'],['Lọc học sinh dưới 5 điểm',/\[\s*\w+\[\s*["']diem["']\s*\]\s*<\s*5\s*\]|query\([^)]*diem\s*<\s*5/,'Lọc bằng df[df["diem"] < 5].'],['Xuất kết quả ra file',/to_csv\(\s*["'][^"']+["']/,'Dùng to_csv("ketqua.csv").'],['Xử lý dòng thiếu dữ liệu',/dropna\(|fillna\(/,'Dùng dropna() hoặc fillna(...).']];
function mrun(){M.code=$('#mc').value;M.res=TS.map(t=>t[1].test(M.code));render()}
function mrst(){M.code=M0;M.res=null;render()}
function MINI(){const n=M.res?M.res.filter(Boolean).length:0,e=M.code.replace(/&/g,'&amp;').replace(/</g,'&lt;');
return `<div class="card"><h1>Mini-project: phân tích điểm lớp học</h1><p>Sửa code để đạt đủ 5 yêu cầu. Bản demo chạy mô phỏng bằng cách kiểm tra mẫu code, chưa chạy Python thật.</p><div class="row"><span class="c">Gợi ý hoàn thành trong 4 giờ</span><span class="c ${n===5?'ok':'w'}">${n} trên 5 yêu cầu đạt</span></div></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h2>Yêu cầu bắt buộc</h2>${TS.map((t,i)=>`<div class="m"><span>${t[0]}${M.res&&!M.res[i]?`<br><small style="color:var(--mut)">${t[2]}</small>`:''}</span>${!M.res?'<span class="c">Chưa chạy</span>':M.res[i]?'<span class="c ok">Đạt</span>':'<span class="c w">Chưa đạt</span>'}</div>`).join('')}</div><div class="card"><div class="tb"><button class="b p" onclick="mrun()">Chạy test</button><button class="b" onclick="mrst()">Đặt lại</button><span class="sp"></span><span class="c w">Chạy mô phỏng</span></div><textarea id="mc" spellcheck="false" aria-label="Khung code mini-project">${e}</textarea>${n===5?'<div class="fb ok"><svg class="av" style="flex:none"><use href="#lib"/></svg><div><b>Hoàn thành mini-project</b><p>Bạn đã đạt đủ các yêu cầu bắt buộc.</p></div></div>':''}</div></div>`}
function OV(){const P=pz(),a=Object.keys(S.res).length===Q.length?avg().toFixed(1)+' sao':'Chưa làm';
const d=['K1','K2','K3'].map(k=>`<div class="m"><span>${K[k]}</span>${mc(mast(k))}${mast(k)==='r'?`<button class="b" onclick="review('${k}')">Xem lại</button>`:''}</div>`).join('');
return `<div class="card"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><svg class="av" style="flex:none"><use href="#lib"/></svg><div><h1>Lộ trình ${W.lib} ${W.ver}</h1><p>${W.days} ngày, ${W.min} phút mỗi ngày. Bài đang học: groupby.</p><button class="b p" onclick="nav('lec')">Tiếp tục học</button></div></div></div><div class="grid"><div class="card"><div class="big">Ngày 3 trên ${W.days}</div><p>Tiến độ học</p></div><div class="card"><div class="big">${a}</div><p>Điểm quiz bài groupby</p></div><div class="card"><div class="big">${P?'Đã mở':'Đang khóa'}</div><p>Mini-project</p></div></div><div class="card"><h2>Mức độ nắm kiến thức</h2>${d}</div>`}
function side(){const show=t=>!S.q||t.toLowerCase().includes(S.q.toLowerCase()),P=pz(),v=S.view;
const it=(t,on,fn,cls,ic)=>show(t)?`<button class="nl ${on?'on':''} ${cls||''}" onclick="${fn}" title="${t}"><svg class="ic"><use href="#${ic}"/></svg><span>${t}</span></button>`:'';
$('#side').innerHTML=`<div class="logo"><i>{ }</i><span>LibLearn</span></div><h4>Bắt đầu</h4>${it('Tạo lộ trình',v==='new',"nav('new')",'','i-grid')}${it('Lộ trình của tôi',v==='ov',"nav('ov')",'','i-book')}<h4>Chương 1: DataFrame</h4>${it('C1L1 DataFrame và loc (xong)',0,"toast('Bài này chưa có nội dung demo')",'','i-check')}${it('C1L2 groupby',v==='lec',"nav('lec')",'','i-code')}${it('C1L3 merge'+(P?'':' (khóa)'),0,P?"toast('C1L3 chưa có nội dung demo')":"toast('Cần trung bình từ 3,5 sao ở quiz groupby để mở bài này')",P?'':'lk',P?'i-code':'i-lock')}<h4>Cuối khóa</h4>${it('Mini-project'+(P?'':' (khóa)'),v==='mini',P?"nav('mini')":"toast('Hoàn thành quiz groupby để mở mini-project')",P?'':'lk',P?'i-flag':'i-lock')}<div class="foot"><button class="nl" onclick="tg()" title="Thu gọn thanh bên"><svg class="ic" style="transform:${S.col?'rotate(180deg)':'none'}"><use href="#i-left"/></svg><span>Thu gọn</span></button></div>`}
function render(){side();$('#app').classList.toggle('col',S.col);const n={new:'Tạo lộ trình',ov:'Lộ trình của tôi',mini:'Mini-project',lec:'C1L2 groupby'}[S.view];$('#bc').textContent='LibLearn / '+n;
$('#v').innerHTML=S.view==='new'?NEW():S.view==='ov'?OV():S.view==='mini'?MINI():S.tab==='lec'?LEC():S.tab==='pr'?PR():QZ()}
S.view='new';render();
</script></body></html>
